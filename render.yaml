services:
  - type: web
    name: sci-j-dmrc-profile
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sci-j-dmrc-db
          property: connectionString
      - key: BACKUP_DATABASE_URL
        fromDatabase:
          name: sci-j-dmrc-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DB_PATH
        value: sci_j_fresh_v2.db

databases:
  - name: sci-j-dmrc-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"