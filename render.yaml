services:
  - type: web
    name: sci-j-dmrc-profile
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKUP_DATABASE_URL
        fromDatabase:
          name: sci-j-dmrc-db
          property: connectionString

databases:
  - name: sci-j-dmrc-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
